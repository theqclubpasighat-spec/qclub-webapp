name: V2 preview safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/v2-mobile-preview-20260927, integration/v2-production-shell-current-20261002]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/v2-preview.test.mjs tests/v2-production-shell.test.mjs tests/fnb-autocomplete.test.mjs
      - name: Production build excludes V2 preview
        run: npm run build && node scripts/check-preview-bundle.mjs absent
        env:
          VERCEL_ENV: production
          QCLUB_LOCAL_V2_PREVIEW: '1'
      - name: Preview build includes V2 preview
        run: npm run build && node scripts/check-preview-bundle.mjs present
        env:
          VERCEL_ENV: preview
