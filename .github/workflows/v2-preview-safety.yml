name: V2 preview safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/v2-mobile-preview-20260927]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install isolated Postgres test engine
        run: npm install --prefix "$RUNNER_TEMP/qclub-tests" --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Run full application and database regression suite
        run: QCLUB_PGLITE_MODULE="$RUNNER_TEMP/qclub-tests/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/*.test.mjs
      - name: Production build excludes V2 preview
        run: npm run build && node scripts/check-preview-bundle.mjs absent
        env:
          VERCEL_ENV: production
          QCLUB_LOCAL_V2_PREVIEW: '1'
      - name: Preview build includes V2 preview
        run: npm run build && node scripts/check-preview-bundle.mjs present
        env:
          VERCEL_ENV: preview
          QCLUB_SECURITY_REHEARSAL: enabled
      - name: Production rebuild excludes all preview code after a preview build
        run: npm run build && node scripts/check-preview-bundle.mjs absent
        env:
          VERCEL_ENV: production
          QCLUB_SECURITY_REHEARSAL: enabled
