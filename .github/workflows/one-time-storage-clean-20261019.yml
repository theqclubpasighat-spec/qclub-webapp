name: One-time verified artifact cleanup
on:
  push:
    branches:
      - ops/storage-clean-20261019
permissions:
  contents: read
  actions: write
jobs:
  remove-one-expired-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the confirmed superseded October 16 browser screenshots
        uses: actions/github-script@v7
        with:
          script: |
            const artifactId = 12037100762;
            const expectedName = 'mobile-browser-fixtures';
            const cutoff = Date.parse('2026-10-17T00:00:00Z');
            const {owner, repo} = context.repo;
            let artifact;
            try {
              ({data: artifact} = await github.rest.actions.getArtifact({
                owner, repo, artifact_id: artifactId,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.notice('Target already absent; no deletion needed.');
                return;
              }
              throw error;
            }
            if (artifact.name !== expectedName ||
                Date.parse(artifact.created_at) >= cutoff ||
                artifact.expired ||
                artifact.size_in_bytes > 10 * 1024 * 1024) {
              throw new Error('Artifact failed allowlist checks. Nothing deleted.');
            }
            await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifactId});
            core.notice('Deleted ONLY artifact ' + artifactId + ', ' + artifact.name +
                        ', ' + artifact.size_in_bytes + ' bytes. Kept newer October 18 and 19 evidence.');
