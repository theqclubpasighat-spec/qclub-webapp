name: Q Club Android TWA CI

on:
  push:
    branches:
      - android/twa-foundation-20260930
    paths:
      - "android-twa/**"
      - ".github/workflows/qclub-android.yml"
  pull_request:
    paths:
      - "android-twa/**"
      - ".github/workflows/qclub-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        run: gradle -p android-twa --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qclub-android-debug
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
